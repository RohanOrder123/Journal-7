name: Build RC Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  # sherpa-onnx 1.13.8 = last line that still contains the built-in eSpeak-NG / Piper phonemizer (removed in 2.0.0)
  SHERPA_VERSION: "1.13.8"
  SHERPA_AAR: sherpa-onnx-static-link-onnxruntime-1.13.8.aar
  # Optional: paste the sha256 shown in the "Sherpa AAR" step summary here to pin the file for future builds. Empty = not pinned.
  SHERPA_AAR_SHA256: ""
  MODELS_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models
  HI_VOICE: hi_IN-priyamvada-medium
  HI_BUNDLE: vits-piper-hi_IN-priyamvada-medium
  HI_BYTES: "67240610"
  HI_SHA256: 399d91cc97eb288725633261f26b715f9a971e3bf7ec4fa1d7910cd0080d37eb
  EN_VOICE: en_US-amy-medium
  EN_BUNDLE: vits-piper-en_US-amy-medium
  EN_BYTES: "67223746"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check required files
        run: |
          # capacitor_config.json (underscore) -> capacitor.config.json (dot)
          if [ ! -f capacitor.config.json ] && [ -f capacitor_config.json ]; then
            mv capacitor_config.json capacitor.config.json
            echo "Renamed capacitor_config.json -> capacitor.config.json"
          fi
          missing=0
          for f in index.html package.json capacitor.config.json voice-bridge-entry.js va-nlu.js va-io.js va-app.js va-core.js va-ui.js va-brain.js va-pro.js va-piper.js SherpaTtsPlugin.java rc-debug.keystore; do
            if [ ! -f "$f" ]; then echo "::error::Missing file in repo root: $f"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi
          grep -q "voice-bridge.js" index.html || echo "::warning::index.html has no voice-bridge.js script tag - native mic / phone voice will not work"
          grep -q "va-piper.js" index.html || { echo "::error::index.html does not load va-piper.js"; exit 1; }
          # the plugin must be the sherpa 1.x version (it announces its target version in the file)
          grep -q 'TARGET_SHERPA = "1.13.8"' SherpaTtsPlugin.java || { echo "::error::SherpaTtsPlugin.java in the repo is not the 1.13.8 version - upload the new file"; exit 1; }
          grep -q "^package com.rohanchauhan.tradesjournal;" SherpaTtsPlugin.java || { echo "::error::SherpaTtsPlugin.java has a wrong package line"; exit 1; }
          echo "All required files present."

      - name: Install dependencies (locked if package-lock.json exists)
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found - exact versions (npm ci)"
            npm ci --no-audit --no-fund --legacy-peer-deps
          else
            echo "::warning::package-lock.json missing - versions may drift. Download the 'package-lock' artifact from this run and upload it to the repo root."
            npm install --no-audit --no-fund --legacy-peer-deps
          fi
          {
            echo "### Resolved plugin versions"
            npm ls @capacitor/core @capacitor/android @capacitor/cli @capacitor/filesystem @capacitor/share @capacitor-community/speech-recognition @capacitor-community/text-to-speech --depth=0 2>/dev/null || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save lockfile as artifact (commit it once for stable builds)
        if: ${{ hashFiles('package-lock.json') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 30

      - name: Run tests (only if the tests folder was uploaded)
        run: |
          for t in tests/nlu-quick.js tests/va-tests.js tests/piper-mock.js; do
            if [ -f "$t" ]; then node "$t"; else echo "$t not present - skipped"; fi
          done

      - name: Prepare web assets and bundle native voice bridge
        run: |
          mkdir -p www
          cp index.html va-*.js www/
          for f in manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; else echo "optional file missing, skipped: $f"; fi
          done
          npm run build:voice

      - name: Add Android platform
        run: npx cap add android

      - name: Patch generated AndroidManifest (speech services + microphone)
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          if (!fs.existsSync(p)) { console.error('Manifest not found: ' + p); process.exit(1); }
          let x = fs.readFileSync(p, 'utf8');
          let add = '';
          ['android.permission.INTERNET',
           'android.permission.RECORD_AUDIO',
           'android.permission.MODIFY_AUDIO_SETTINGS'].forEach(function (n) {
            if (x.indexOf('android:name="' + n + '"') === -1)
              add += '    <uses-permission android:name="' + n + '" />\n';
          });
          if (x.indexOf('android.hardware.microphone') === -1)
            add += '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n';
          const actions = ['android.speech.RecognitionService',
                           'android.intent.action.TTS_SERVICE',
                           'android.speech.tts.engine.INSTALL_TTS_DATA'];
          const need = actions.filter(function (a) { return x.indexOf('android:name="' + a + '"') === -1; });
          const intents = need.map(function (a) {
            return '        <intent><action android:name="' + a + '" /></intent>\n';
          }).join('');
          if (intents) {
            if (/<\/queries>/.test(x)) x = x.replace('</queries>', intents + '    </queries>');
            else add += '    <queries>\n' + intents + '    </queries>\n';
          }
          if (add) {
            if (!/<\/manifest>/.test(x)) { console.error('Invalid manifest (no </manifest>)'); process.exit(1); }
            x = x.replace('</manifest>', add + '</manifest>');
          }
          fs.writeFileSync(p, x);
          console.log('Manifest patched. Added: ' + (add ? 'yes' : 'nothing (already patched)'));
          NODE

      - name: Generate Android launcher icons
        continue-on-error: true
        run: |
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#06080e' --iconBackgroundColorDark '#06080e' --splashBackgroundColor '#06080e' --splashBackgroundColorDark '#06080e'
          else
            echo "assets/icon.png not found - default launcher icon will be used"
          fi

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Force Java 17 in native plugins (fix invalid source release 21)
        run: |
          for f in node_modules/@capacitor-community/*/android/build.gradle node_modules/@capacitor/*/android/build.gradle; do
            [ -f "$f" ] || continue
            sed -i -E 's/VERSION_(1[89]|2[0-9])/VERSION_17/g; s/(sourceCompatibility|targetCompatibility)[ =]+"?(1[89]|2[0-9])"?/\1 JavaVersion.VERSION_17/g; s/jvmTarget *= *"?(1[89]|2[0-9])"?/jvmTarget = "17"/g' "$f"
            echo "== $f"; grep -nE "Compatibility|jvmTarget|VERSION_" "$f" || true
          done
          if grep -rnE "VERSION_(1[89]|2[0-9])" node_modules/@capacitor-community/*/android/build.gradle; then
            echo "::error::Plugin still requests Java > 17"; exit 1
          fi

      # ------------------------------------------------------------------
      # Piper voices: bundled INSIDE the APK (no in-app download, no OPFS, works offline from first launch)
      # ------------------------------------------------------------------
      - name: Download Piper voice bundles and verify size / checksum
        run: |
          set -e
          fetch() { # name expected_bytes
            curl -fL --retry 3 -o "$1.tar.bz2" "$MODELS_URL/$1.tar.bz2"
            got=$(stat -c %s "$1.tar.bz2")
            [ "$got" = "$2" ] || { echo "::error::$1 size $got != expected $2 (upstream file changed - send this log to Claude)"; exit 1; }
          }
          fetch "$HI_BUNDLE" "$HI_BYTES"
          fetch "$EN_BUNDLE" "$EN_BYTES"
          echo "$HI_SHA256  $HI_BUNDLE.tar.bz2" | sha256sum -c - || { echo "::error::Hindi bundle checksum mismatch"; exit 1; }
          EN_SHA=$(sha256sum "$EN_BUNDLE.tar.bz2" | cut -d' ' -f1)
          mkdir -p dl && tar xjf "$HI_BUNDLE.tar.bz2" -C dl && tar xjf "$EN_BUNDLE.tar.bz2" -C dl
          {
            echo "### Voice bundles"
            echo "- Hindi $HI_VOICE: $HI_BYTES bytes, sha256 verified"
            echo "- English $EN_VOICE: $EN_BYTES bytes, sha256 \`$EN_SHA\` (pin this in the workflow to also verify English)"
            echo "- Licenses: Hindi priyamvada = CC BY-NC-SA 4.0 (NON-COMMERCIAL, personal use only). English amy: see MODEL_CARD below"
            echo '```'; cat "dl/$EN_BUNDLE/MODEL_CARD" 2>/dev/null | head -12; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # the phonemizer data must be identical, because the app ships it only once
          diff -rq "dl/$HI_BUNDLE/espeak-ng-data" "dl/$EN_BUNDLE/espeak-ng-data" || { echo "::error::espeak-ng-data differs between Hindi and English bundle - the shared copy would be wrong"; exit 1; }
          for f in "dl/$HI_BUNDLE/$HI_VOICE.onnx" "dl/$HI_BUNDLE/tokens.txt" "dl/$EN_BUNDLE/$EN_VOICE.onnx" "dl/$EN_BUNDLE/tokens.txt" \
                   "dl/$HI_BUNDLE/espeak-ng-data/phondata" "dl/$HI_BUNDLE/espeak-ng-data/hi_dict" "dl/$HI_BUNDLE/espeak-ng-data/en_dict"; do
            test -s "$f" || { echo "::error::Missing inside bundle: $f"; exit 1; }
          done
          V=android/app/src/main/assets/voices
          mkdir -p "$V/$HI_VOICE" "$V/$EN_VOICE"
          cp "dl/$HI_BUNDLE/$HI_VOICE.onnx" "dl/$HI_BUNDLE/tokens.txt" "$V/$HI_VOICE/"
          cp "dl/$EN_BUNDLE/$EN_VOICE.onnx" "dl/$EN_BUNDLE/tokens.txt" "$V/$EN_VOICE/"
          cp -r "dl/$HI_BUNDLE/espeak-ng-data" "$V/espeak-ng-data"
          du -sh "$V"/* | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ESPEAK_FILES=$(find "$V/espeak-ng-data" -type f | wc -l)" >> "$GITHUB_ENV"
          rm -rf dl *.tar.bz2

      # ------------------------------------------------------------------
      # Host-side synthesis test with the SAME sherpa-onnx 1.13.8 core + the SAME model files that go into the APK.
      # This is a proxy for the phone (Linux, not Android), but it proves the two Piper voices phonemize and
      # synthesize under 1.13.8. It FAILS the build if a voice produces no audio.
      # If the Python wheel itself cannot be installed (network / no wheel), the test is SKIPPED with a warning.
      # ------------------------------------------------------------------
      - name: Synthesis test on the runner (Hindi + English, sherpa-onnx 1.13.8)
        run: |
          V=android/app/src/main/assets/voices
          cat > /tmp/synth_test.py <<'PY'
          import sys, struct, math
          import sherpa_onnx
          V = sys.argv[1]; HI = sys.argv[2]; EN = sys.argv[3]
          HI_TEXT = "\u0928\u092e\u0938\u094d\u0924\u0947 \u0930\u094b\u0939\u0928 \u091c\u0940, \u092e\u0948\u0902 \u0935\u0947\u0926\u093e \u0939\u0942\u0901\u0964 \u092f\u0939 \u0939\u093f\u0902\u0926\u0940 \u0906\u0935\u093e\u091c\u093c \u0915\u093e \u092a\u0930\u0940\u0915\u094d\u0937\u0923 \u0939\u0948\u0964"
          EN_TEXT = "Hello Rohan ji, this is an offline English voice test."
          print("sherpa_onnx version:", getattr(sherpa_onnx, "__version__", "unknown"))
          bad = 0
          for vid, text in ((HI, HI_TEXT), (EN, EN_TEXT)):
              cfg = sherpa_onnx.OfflineTtsConfig(
                  model=sherpa_onnx.OfflineTtsModelConfig(
                      vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                          model=f"{V}/{vid}/{vid}.onnx",
                          tokens=f"{V}/{vid}/tokens.txt",
                          data_dir=f"{V}/espeak-ng-data"),
                      num_threads=2, debug=False, provider="cpu"),
                  max_num_sentences=1)
              tts = sherpa_onnx.OfflineTts(cfg)
              a = tts.generate(text, sid=0, speed=1.0)
              n = len(a.samples); sr = a.sample_rate
              peak = max((abs(x) for x in a.samples), default=0.0)
              dur = n / sr if sr else 0
              ok = n > 0 and sr > 0 and dur > 0 and peak > 0.01
              line = f"{vid}: samples={n} sampleRate={sr} duration={dur:.2f}s peak={peak:.3f} -> {'PASS' if ok else 'FAIL'}"
              print(line)
              with open("/tmp/synth_summary.txt", "a") as f: f.write("- " + line + "\n")
              if not ok: bad += 1
          sys.exit(1 if bad else 0)
          PY
          if pip install --quiet "sherpa-onnx==$SHERPA_VERSION"; then
            echo "### Synthesis test (runner, sherpa-onnx $SHERPA_VERSION)" >> "$GITHUB_STEP_SUMMARY"
            rm -f /tmp/synth_summary.txt
            if python3 /tmp/synth_test.py "$V" "$HI_VOICE" "$EN_VOICE" 2>&1 | tee /tmp/synth.log; then :; fi
            [ -f /tmp/synth_summary.txt ] && cat /tmp/synth_summary.txt >> "$GITHUB_STEP_SUMMARY"
            if grep -q "FAIL" /tmp/synth.log || ! grep -q "$EN_VOICE: samples" /tmp/synth.log || ! grep -q "$HI_VOICE: samples" /tmp/synth.log; then
              echo "::error::Piper synthesis test FAILED under sherpa-onnx $SHERPA_VERSION - see the log above (send it to Claude)"; exit 1
            fi
            echo "Synthesis test passed for both voices (runner proxy)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::pip could not install sherpa-onnx==$SHERPA_VERSION - runner synthesis test SKIPPED. Use the in-app selfTestAll on the phone."
            echo "- Runner synthesis test SKIPPED (python wheel not installable)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Add sherpa-onnx Android library and the native SherpaTts plugin
        run: |
          set -e
          mkdir -p android/app/libs
          AAR="android/app/libs/$SHERPA_AAR"
          curl -fL --retry 3 -o "$AAR" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$SHERPA_VERSION/$SHERPA_AAR"
          SIZE=$(stat -c %s "$AAR"); SHA=$(sha256sum "$AAR" | cut -d' ' -f1)
          {
            echo "### Sherpa AAR"
            echo "- file: $SHERPA_AAR"
            echo "- size: $SIZE bytes"
            echo "- sha256: \`$SHA\` (paste into SHERPA_AAR_SHA256 in this workflow to pin it)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$SIZE" -gt 10000000 ] || { echo "::error::AAR is only $SIZE bytes - download is not the real library"; exit 1; }
          if [ -n "$SHERPA_AAR_SHA256" ]; then
            [ "$SHA" = "$SHERPA_AAR_SHA256" ] || { echo "::error::AAR sha256 $SHA != pinned $SHERPA_AAR_SHA256"; exit 1; }
          fi
          unzip -tq "$AAR" >/dev/null || { echo "::error::AAR is not a valid zip"; exit 1; }
          # native libraries for both ABIs we ship
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$AAR" | grep -q "jni/$abi/libsherpa-onnx-jni.so" || { echo "::error::AAR has no $abi native library (libsherpa-onnx-jni.so)"; exit 1; }
          done
          # Java/Kotlin API check: every method the plugin calls must exist in this AAR (fails BEFORE the long Gradle build)
          rm -rf /tmp/aar && mkdir -p /tmp/aar && unzip -q "$AAR" classes.jar -d /tmp/aar
          J=/tmp/aar/classes.jar
          api() { javap -cp "$J" "$1" 2>/dev/null; }
          chk() { api "$1" | grep -q "$2" || { echo "::error::sherpa-onnx $SHERPA_VERSION AAR: $1 has no '$2' - the plugin does not match this AAR"; exit 1; }; }
          chk com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig setModel
          chk com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig setTokens
          chk com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig setDataDir
          chk com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig setNoiseScale
          chk com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig setNoiseScaleW
          chk com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig setLengthScale
          chk com.k2fsa.sherpa.onnx.OfflineTtsModelConfig setVits
          chk com.k2fsa.sherpa.onnx.OfflineTtsModelConfig setNumThreads
          chk com.k2fsa.sherpa.onnx.OfflineTtsModelConfig setDebug
          chk com.k2fsa.sherpa.onnx.OfflineTtsModelConfig setProvider
          chk com.k2fsa.sherpa.onnx.OfflineTtsConfig setModel
          chk com.k2fsa.sherpa.onnx.OfflineTtsConfig setMaxNumSentences
          chk com.k2fsa.sherpa.onnx.OfflineTts "android.content.res.AssetManager"
          chk com.k2fsa.sherpa.onnx.OfflineTts " generate("
          chk com.k2fsa.sherpa.onnx.OfflineTts sampleRate
          chk com.k2fsa.sherpa.onnx.OfflineTts release
          chk com.k2fsa.sherpa.onnx.GeneratedAudio getSamples
          chk com.k2fsa.sherpa.onnx.GeneratedAudio getSampleRate
          echo "- Java/Kotlin API check against the AAR: all methods used by SherpaTtsPlugin exist" | tee -a "$GITHUB_STEP_SUMMARY"
          PKG=android/app/src/main/java/com/rohanchauhan/tradesjournal
          mkdir -p "$PKG"
          cp SherpaTtsPlugin.java "$PKG/SherpaTtsPlugin.java"
          cat > "$PKG/MainActivity.java" <<'JAVA'
          package com.rohanchauhan.tradesjournal;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SherpaTtsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          node - <<'NODE'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let g = fs.readFileSync(p, 'utf8');
          function rep(a, b) { if (g.split(a).length !== 2) { console.error('::error::pattern not found exactly once in app/build.gradle: ' + a); process.exit(1); } g = g.replace(a, b); }
          // arm64 + 32-bit arm so the APK installs on every normal phone; models must not be compressed (faster load)
          rep('versionName "1.0"', 'versionName "1.0"\n        ndk { abiFilters \'arm64-v8a\', \'armeabi-v7a\' }');
          rep('compileSdk rootProject.ext.compileSdkVersion', 'compileSdk rootProject.ext.compileSdkVersion\n    androidResources { noCompress \'onnx\' }');
          rep("implementation project(':capacitor-android')", "implementation project(':capacitor-android')\n    implementation(name: '" + process.env.SHERPA_AAR.replace(/\.aar$/, '') + "', ext: 'aar')\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:1.8.22\"");
          fs.writeFileSync(p, g);
          NODE
          echo "----- android/app/build.gradle -----"; cat android/app/build.gradle

      - name: Verify speech plugins, web files and voice assets before building
        run: |
          npm ls @capacitor-community/speech-recognition --depth=0
          npm ls @capacitor-community/text-to-speech --depth=0
          test -s voice-bridge-entry.js
          test -s www/voice-bridge.js
          grep -q RCTextToSpeech www/voice-bridge.js
          grep -q RCSpeechRecognition www/voice-bridge.js
          for f in va-nlu va-io va-app va-core va-ui va-brain va-pro va-piper; do test -s www/$f.js; done
          test -d node_modules/@capacitor-community/speech-recognition/android
          test -d node_modules/@capacitor-community/text-to-speech/android
          M=android/app/src/main/AndroidManifest.xml
          for perm in RECORD_AUDIO MODIFY_AUDIO_SETTINGS INTERNET; do grep -q "android.permission.$perm" "$M" || { echo "::error::Manifest permission missing: $perm"; exit 1; }; done
          grep -q RecognitionService "$M"
          V=android/app/src/main/assets/voices
          for f in "$V/$HI_VOICE/$HI_VOICE.onnx" "$V/$HI_VOICE/tokens.txt" "$V/$EN_VOICE/$EN_VOICE.onnx" "$V/$EN_VOICE/tokens.txt" "$V/espeak-ng-data/phondata" "$V/espeak-ng-data/hi_dict" "$V/espeak-ng-data/en_dict"; do
            test -s "$f" || { echo "::error::Piper voice file missing before the build: $f"; exit 1; }
          done
          [ "$ESPEAK_FILES" -ge 20 ] || { echo "::error::only $ESPEAK_FILES espeak-ng-data files"; exit 1; }
          P=android/app/src/main/java/com/rohanchauhan/tradesjournal
          test -s "$P/SherpaTtsPlugin.java"
          grep -q "registerPlugin(SherpaTtsPlugin.class)" "$P/MainActivity.java"
          # the Sherpa dependency must be 1.13.8 and nothing may still reference 2.x
          grep -q "sherpa-onnx-static-link-onnxruntime-$SHERPA_VERSION" android/app/build.gradle || { echo "::error::build.gradle does not reference the $SHERPA_VERSION AAR"; exit 1; }
          test -s "android/app/libs/$SHERPA_AAR"
          if ls android/app/libs | grep -E "sherpa.*(2\.[0-9]+\.[0-9]+)"; then echo "::error::an old Sherpa 2.x AAR is still in android/app/libs"; exit 1; fi
          if grep -n "2\.0\.3" android/app/build.gradle; then echo "::error::2.0.3 still referenced in build.gradle"; exit 1; fi
          echo "Plugins, bridge, voice modules, Piper assets, Sherpa $SHERPA_VERSION dependency and manifest entries are present."

      - name: Use the fixed signing key (APK updates over the old one, data stays)
        run: |
          mkdir -p ~/.android
          cp rc-debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -2

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify the built APK (fails loudly if Piper is missing)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c %s "$APK"); echo "APK size: $SIZE bytes"
          [ "$SIZE" -gt 100000000 ] || { echo "::error::APK is only $SIZE bytes - Piper models are not inside it"; exit 1; }
          [ "$SIZE" -lt 450000000 ] || { echo "::error::APK is $SIZE bytes - unexpectedly huge, something extra was packaged"; exit 1; }
          unzip -l "$APK" > /tmp/apk.txt
          for f in assets/public/index.html assets/public/voice-bridge.js assets/public/va-nlu.js assets/public/va-io.js assets/public/va-app.js assets/public/va-brain.js assets/public/va-pro.js assets/public/va-core.js assets/public/va-ui.js assets/public/va-piper.js \
                   "assets/voices/$HI_VOICE/$HI_VOICE.onnx" "assets/voices/$HI_VOICE/tokens.txt" \
                   "assets/voices/$EN_VOICE/$EN_VOICE.onnx" "assets/voices/$EN_VOICE/tokens.txt" \
                   assets/voices/espeak-ng-data/phondata assets/voices/espeak-ng-data/hi_dict assets/voices/espeak-ng-data/en_dict \
                   lib/arm64-v8a/libsherpa-onnx-jni.so lib/armeabi-v7a/libsherpa-onnx-jni.so AndroidManifest.xml; do
            grep -q "$f" /tmp/apk.txt || { echo "::error::Missing inside APK: $f"; exit 1; }
          done
          APK_ESPEAK=$(awk '{print $4}' /tmp/apk.txt | grep "^assets/voices/espeak-ng-data/" | grep -vc '/$' || true)
          echo "espeak files: source=$ESPEAK_FILES inside APK=$APK_ESPEAK" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$APK_ESPEAK" = "$ESPEAK_FILES" ] || { echo "::error::espeak-ng-data files were dropped while packaging the APK ($ESPEAK_FILES -> $APK_ESPEAK)"; exit 1; }
          unzip -p "$APK" 'classes*.dex' | strings | grep -q "SherpaTtsPlugin" || { echo "::error::SherpaTtsPlugin class is not in the APK dex"; exit 1; }
          unzip -p "$APK" 'classes*.dex' | strings | grep -q "com/k2fsa/sherpa/onnx/OfflineTts" || { echo "::error::sherpa-onnx Java classes are not in the APK dex"; exit 1; }
          {
            echo "### APK"
            echo "- size: $((SIZE/1048576)) MB"
            echo '- biggest entries:'; echo '```'
            unzip -lv "$APK" | sort -k1 -n -r | head -8
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          keytool -printcert -jarfile "$APK" 2>&1 | grep -E "Owner|SHA256" | tee -a "$GITHUB_STEP_SUMMARY" || true
          # signature: must verify AND match the fixed rc-debug.keystore (otherwise it will not install as an update)
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" > /tmp/sign.txt 2>&1 || { cat /tmp/sign.txt; echo "::error::APK signature does not verify"; exit 1; }
            GOT=$(grep -i "certificate SHA-256 digest" /tmp/sign.txt | head -1 | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')
            WANT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-F' 'a-f')
            echo "APK signer sha256: $GOT" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "rc-debug.keystore sha256: $WANT" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$GOT" ] && [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then echo "::error::APK is NOT signed with rc-debug.keystore - it would not update your old APK"; exit 1; fi
            { [ -z "$GOT" ] || [ -z "$WANT" ]; } && echo "::warning::could not compare signing fingerprints automatically"
          else
            echo "::warning::apksigner not found on the runner - signature fingerprint check skipped"
          fi
          echo "APK verified: web files, Piper models, espeak data, native libraries, plugin class and signature present." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RC-Trading-Journal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
